<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#0d1a26"/>
    </linearGradient>
    <linearGradient id="magma" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7a2410"/>
      <stop offset="45%" stop-color="#e8672a"/>
      <stop offset="55%" stop-color="#f0a24a"/>
      <stop offset="100%" stop-color="#7a2410"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- host sediment layers, oldest (deepest) at bottom -->
  <g>
    <rect x="0" y="820" width="1600" height="80" fill="#241d18"/>
    <rect x="0" y="680" width="1600" height="140" fill="#4f3d2c"/>
    <rect x="0" y="560" width="1600" height="120" fill="#3f463a"/>
    <rect x="0" y="460" width="1600" height="100" fill="#b3945c"/>
    <rect x="0" y="330" width="1600" height="130" fill="#5c4a3a"/>
    <rect x="0" y="280" width="1600" height="50" fill="#171310"/>
    <rect x="0" y="180" width="1600" height="100" fill="#a68c56"/>
    <rect x="0" y="80" width="1600" height="100" fill="#37423a"/>
  </g>

  <!-- faint bedding lines for texture -->
  <g stroke="#000" stroke-opacity="0.12" stroke-width="2">
    <line x1="0" y1="230" x2="1600" y2="230"/>
    <line x1="0" y1="510" x2="1600" y2="510"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>

  <!-- chilled-margin halo behind the intrusion -->
  <g filter="url(#glow)" opacity="0.55">
    <path d="M700 900 L790 900 L790 660 L1140 660 L1140 610 L860 610
             L860 300 L1060 300 L1060 260 L230 260 L230 300 L810 300
             L810 610 L700 610 Z" fill="#e8672a" opacity="0.5"/>
  </g>

  <!-- the intrusion: feeder dyke -> sill -> branch dyke -> upper sill,
       pinching out before the surface (these stay intrusive, never erupt) -->
  <path d="M700 900 L790 900 L790 660 L1140 660 L1140 610 L860 610
           L860 300 L1000 300 L1000 260 L965 190 L900 260 L860 300
           L810 300 L810 610 L700 610 Z"
        fill="url(#magma)" stroke="#2e0f06" stroke-width="3"/>

  <!-- annotations -->
  <g fill="#e8f0f8" font-size="27" font-weight="600">
    <text x="1180" y="600">Sill</text>
    <text x="620" y="470">Dyke</text>
    <text x="1090" y="140">Apophysis pinches out</text>
    <text x="130" y="215">Sill</text>
  </g>

  <g fill="#8fd4f0" font-size="20" opacity="0.92">
    <text x="1180" y="627">magma spreads along a weak bedding plane</text>
    <text x="620" y="497">magma rises through a vertical fracture</text>
    <text x="1090" y="165">before reaching the surface — no eruption</text>
    <text x="130" y="242">a second sheet exploits a shallower bedding plane</text>
  </g>

  <text x="80" y="880" fill="#e8f0f8" font-size="22" opacity="0.7">Magma source at depth</text>

  <!-- extensional stress arrows -->
  <g stroke="#e8f0f8" stroke-width="4" opacity="0.55">
    <line x1="560" y1="60" x2="480" y2="60" marker-end="url(#arrow)"/>
    <line x1="1040" y1="60" x2="1120" y2="60" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e8f0f8"/>
    </marker>
  </defs>
  <text x="800" y="50" fill="#e8f0f8" font-size="18" text-anchor="middle" opacity="0.6" letter-spacing="0.08em">CRUSTAL EXTENSION</text>
</svg>
